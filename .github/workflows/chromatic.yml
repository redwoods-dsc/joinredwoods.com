name: Chromatic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:visual

      - name: Upload to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          playwright: true
          diagnosticsFile: true
        env:
          CHROMATIC_ARCHIVE_LOCATION: ./test-results

      # TEMPORARY: surfaces Chromatic's build error, which the CLI log omits.
      # Remove once the "failed to render" build error is resolved.
      - name: Upload Chromatic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-diagnostics
          path: chromatic-diagnostics.json
          if-no-files-found: warn
